<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
 
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
 
    <title>CRUD com LocalStorage</title>
 
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>
 
<body>
 
    <h1>Cadastro de Usuários</h1>
 
 
    <section>
 
        <h2>Novo usuário</h2>
 
        <input
            type="text"
            id="nome"
            placeholder="Digite o nome"
        >
 
        <button onclick="cadastrarUsuario()">
            Cadastrar
        </button>
 
        <p id="mensagem"></p>
 
    </section>
 
 
    <section>
 
        <h2>Usuários cadastrados</h2>
 
        <button onclick="buscarUsuarios()">
            Atualizar lista
        </button>
 
        <ul id="listaUsuarios"></ul>
 
    </section>
 
 
    <section>
 
        <h2>Atualizar usuário</h2>
 
        <input
            type="number"
            id="idAtualizar"
            placeholder="ID do usuário"
        >
 
        <input
            type="text"
            id="nomeAtualizar"
            placeholder="Novo nome"
        >
 
        <button onclick="atualizarUsuario()">
            Atualizar
        </button>
 
    </section>
 
 
    <section>
 
        <h2>Excluir usuário</h2>
 
        <input
            type="number"
            id="idExcluir"
            placeholder="ID do usuário"
        >
 
        <button onclick="excluirUsuario()">
            Excluir
        </button>
 
    </section>
 
 
    <script src="scripts.js"></script>
 
</body>
 
</html>
